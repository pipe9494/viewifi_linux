name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name viewifi-host-linux-${{ matrix.arch }} run.py
      - name: Boot test (simulation mode)
        run: |
          timeout 25 ./dist/viewifi-host-linux-${{ matrix.arch }} --sim &
          PID=$!
          sleep 6
          curl -sf http://127.0.0.1:8080/api/status | grep -q device_name
          curl -sf http://127.0.0.1:8080/ | grep -qi viewifi
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/viewifi-host-linux-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x viewifi-host-linux-*
          gh release create "${GITHUB_REF_NAME}" viewifi-host-linux-* \
            --title "Viewifi Host ${GITHUB_REF_NAME}" --generate-notes
